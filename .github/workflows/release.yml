name: Release Mod Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: Cracklatro

      - name: Prepare and Zip Mod
        run: |
          mkdir -p package/Cracklatro
          rsync -av --exclude='.git' --exclude='.github' --exclude='bmi' Cracklatro/ package/Cracklatro/
          cd package
          zip -r ../Cracklatro.zip Cracklatro/
          cd ..

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: Cracklatro.zip
          generate_release_notes: true
