name: Release Mod Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: Cracklatro

      - name: Prepare and Zip Mod
        run: |
          mkdir -p package/Cracklatro
          rsync -av --exclude='.git' --exclude='.github' --exclude='bmi' Cracklatro/ package/Cracklatro/
          cd package
          zip -r ../Cracklatro.zip Cracklatro/
          cd ..

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Cracklatro.zip
          generate_release_notes: true
